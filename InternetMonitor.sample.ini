# Internet Monitor - optional settings
#
# To use: rename this file to  InternetMonitor.ini  and keep it in the same
# folder as InternetMonitor.exe. Every line is optional; delete or leave the
# "#" in front of anything you do not want to change.

# Name shown in the window and at the top of every report.
#Organisation = Example School

# Added to the identification this program sends with every web check, so the
# administrators of a tested site can see who to ask about it. Optional.
#Contact = it-support@example.sch.uk

# Wi-Fi signal strength and access point. Windows only releases these when
# Location services are on. "auto" (default) records them when that is already
# allowed and otherwise quietly records link speed instead; it never causes a
# Windows prompt. "off" never asks. "on" always asks (Windows may show a prompt).
#WifiDetails = auto

# Where logs and reports are saved. Default: the folder the EXE is in
# (falling back to the user's Documents folder if that is read-only).
# A network share lets IT collect results from many computers in one place;
# file names include the computer name, so they never collide.
#DataFolder = \\server\share\InternetMonitor

# Which network adapter to test through, on a computer that has more than one.
# Give the adapter's name as Windows shows it (for example: Ethernet 2) or its IP
# address. Default: auto, which lets Windows choose and may mix two connections.
#Adapter = auto

# Default choices in the window (users can still change them before starting).
# Interval: adaptive, or a number of seconds from this list: 1, 2, 5, 10, 30, 60
#Interval = adaptive
# DurationMinutes: 0 (until stopped), 15, 60, 240, 480, 1440 or 10080
#DurationMinutes = 0
#KeepAwake = true

# How long to wait for each check before calling it a failure (milliseconds).
#TimeoutMs = 3000

# Web checks (go through the web filter / proxy, exactly like a browser).
# Format:  Http = Name | URL | status:NNN | text:words the page must contain | region:label | every:SECONDS
# (everything after the URL is optional; region is only a label shown beside the check).
#
# IMPORTANT - be a good neighbour. The first four below are endpoints their owners built
# for automatic connectivity testing, so they may be checked every few seconds. Any ordinary
# website (Hwb, your MIS, your own school site) must have  every:60  or slower. That makes it
# a "service check": tested gently, reported in its own right, and never counted towards
# Online / Outage. A site that answers "429 Too Many Requests" is left alone for 15 minutes.
#
# Listing any Http line replaces ALL the built-in checks, which are:
#Http = Google     | https://www.google.com/generate_204            | status:204 | region:Global (US-run)
#Http = Microsoft  | http://www.msftconnecttest.com/connecttest.txt | text:Microsoft Connect Test | region:Global (US-run)
#Http = Cloudflare | https://www.cloudflare.com/cdn-cgi/trace       | text:colo= | region:Global (US-run)
#Http = Gstatic    | https://connectivitycheck.gstatic.com/generate_204 | status:204 | region:Global (US-run)
#Http = Hwb        | https://hwb.gov.wales/robots.txt               | status:200 | text:User-agent | region:Wales | every:60
#
# HTTPS inspection: the program works out for itself which of these sites your web filter
# decrypts (their certificates are issued by the filter instead of the real authority).
# Gstatic is the address Android uses to test its connection; filters normally leave it
# alone, so it is the comparison that shows when a fault is in the filter's HTTPS inspection.
# If you list your own checks, keep at least one HTTPS site that your filter does not decrypt.

# Direct connection checks (bypass the proxy; used to tell a proxy fault
# from an internet-line fault).  Format:  Tcp = Name | host-or-IP | port | region:label
#Tcp = Cloudflare | 1.1.1.1       | 443 | region:Global (US-run)
#Tcp = Google     | 8.8.8.8       | 443 | region:Global (US-run)
#Tcp = Quad9      | 9.9.9.9       | 443 | region:Global (Swiss)
